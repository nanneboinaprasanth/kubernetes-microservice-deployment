replicaCount: 2

image:
  repository: your-dockerhub-user/portfolio-website
  tag: "1.0.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: portfolio.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

config:
  APP_NAME: portfolio-website
  APP_ENV: production
  PUBLIC_SITE_URL: https://portfolio.local

secret:
  CONTACT_EMAIL: hello@example.com
  ANALYTICS_TOKEN: replace-me

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

