name: Security and Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint project files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            README.md
            SECURITY.md

      - name: Lint YAML manifests
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: |
            .github/dependabot.yml
            .github/workflows/security-quality.yml
            manifests/
            helm/portfolio-website/Chart.yaml
            helm/portfolio-website/values.yaml

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile

  kubernetes:
    name: Validate Kubernetes and Helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm chart
        run: helm lint helm/portfolio-website

      - name: Render Helm chart
        run: helm template portfolio helm/portfolio-website --namespace portfolio > rendered.yaml

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz -o kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate raw manifests
        run: kubeconform -strict -summary manifests/

      - name: Validate rendered Helm manifests
        run: kubeconform -strict -summary rendered.yaml

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: kubernetes,dockerfile,secrets
          quiet: true
          soft_fail: true

